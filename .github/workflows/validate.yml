name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: بررسی سینتکس فایل‌های JavaScript
        run: |
          for f in js/*.js scripts/*.js; do
            node --check "$f"
          done

      - name: بررسی یکپارچگی داده‌ها، لینک‌ها و sitemap
        run: node scripts/validate-data.js
